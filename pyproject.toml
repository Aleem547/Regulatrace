[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regulatrace"
version = "0.1.0"
description = "Citation-Grounded RAG for Regulatory Documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Faizan0602 and upstream contributors" }
]
dependencies = [
    "pydantic-settings>=2.0.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "pymupdf>=1.23.0",
    "langchain-core>=1.4.7,<2.0.0",
    "langchain-text-splitters>=0.2.0",
    "tiktoken>=0.14.0,<1.0.0",
    "qdrant-client>=1.9.0",
    "sqlalchemy>=2.0.0,<3.0.0",
"psycopg2-binary>=2.9.0,<3.0.0",
"alembic>=1.13.0,<2.0.0",
]

[project.optional-dependencies]

api = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "email-validator>=2.0.0,<3.0.0",
    "argon2-cffi>=25.1.0,<26.0.0",
    "PyJWT>=2.10.1,<3.0.0",
]
gemini = ["google-genai>=2.29.0,<3.0.0"]
groq = ["groq>=1.7.0,<2.0.0"]
space = ["gradio[oauth,mcp]==6.31.0", "fastembed==0.9.1", "spaces>=0.51.3,<1.0.0"]
tracing = [
    "langfuse>=4.7.0,<5.0.0; python_version < '3.11'",
    "langfuse>=5.0.4,<6.0.0; python_version >= '3.11'",
]
# 0.4.2 removed vertexai, which RAGAS 0.4.3 still imports at startup.
eval = [
    "ragas==0.4.3",
    "langchain-community==0.4.1",
    "google-genai>=2.29.0,<3.0.0",
    "instructor[google-genai]>=1.17.0,<2.0.0",
]

dev = [
    "ruff>=0.6.0",
    "pre-commit>=3.5.0",
    "pytest>=8.0.0",
    "httpx>=0.28.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
